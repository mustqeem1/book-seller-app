<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buy Books - Old Books Marketplace</title>
    <link rel="stylesheet" href="css/buy.css">  <!-- If your CSS is in 'frontend/css/', change to 'frontend/css/buy.css'. Confirm your repo structure. -->
    <style>
        /* Nav styles (matching homepage) */
        nav#navMenu {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 255, 132, 0.1);
            border-radius: 8px;
            padding: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }
        nav#navMenu ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            gap: 15px;
        }
        nav#navMenu li {
            display: inline;
        }
        nav#navMenu a {
            text-decoration: none;
            color: #008f68;
            font-weight: bold;
            padding: 5px 10px;
            border-radius: 4px;
            transition: background 0.3s;
        }
        nav#navMenu a:hover, nav#navMenu a.active {
            background-color: #00ff84;
            color: #fff;
        }
        @media (max-width: 600px) {
            nav#navMenu {
                top: 10px;
                right: 10px;
                padding: 5px;
            }
            nav#navMenu ul {
                flex-direction: column;
                gap: 5px;
            }
            nav#navMenu a {
                padding: 3px 8px;
                font-size: 14px;
            }
        }
        /* Scrolling text - Fixed: Slower, non-looping animation to prevent flicker */
        .scrolling-text {
            background: #008f68;
            color: white;
            padding: 10px;
            font-size: 14px;
            overflow: hidden;
            white-space: nowrap;
            animation: scroll 30s linear forwards;  /* Changed to forwards (no loop), slower duration */
            will-change: transform;  /* Optimizes animation performance */
        }
        @keyframes scroll {
            0% { transform: translateX(100%); }
            100% { transform: translateX(-100%); }
        }
        /* Book grid - Fixed: Prevent flicker by using fixed heights and incremental updates */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
            min-height: 400px;  /* Prevents layout shift */
        }
        .book-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #fff;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
            min-height: 350px;  /* CHANGED: Flexible height to prevent cutting */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: min-height 0.3s ease;  /* Smooth expansion */
        }
        .book-card.expanded {
            min-height: 450px;  /* CHANGED: Expand when full details are shown */
        }
        .book-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;  /* Ensures image fits without distortion */
            border-radius: 4px;
            loading: lazy;  /* Lazy load to reduce initial flicker */
        }
        .book-card h3 {
            margin: 10px 0;
            font-size: 18px;
            /* REMOVED: overflow: hidden; text-overflow: ellipsis; to show full text */
        }
        .book-card p {
            margin: 5px 0;
            font-size: 14px;
            /* REMOVED: overflow: hidden; text-overflow: ellipsis; to show full text */
        }
        .contact-btn {
            background: #00ff84;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        .contact-btn:hover {
            background: #008f68;
        }
        /* Filters */
        .filters {
            padding: 20px;
            background: #f9f9f9;
            border-bottom: 1px solid #ccc;
        }
        .filters input, .filters select {
            margin: 5px;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }
        .load-more {
            display: block;
            margin: 20px auto;
            padding: 10px 20px;
            background: #008f68;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .load-more:hover {
            background: #00ff84;
        }
        /* Hide full details by default */
        .full-details { display: none; }
    </style>
</head>
<body>
    <div class="scrolling-text">
        Welcome! &nbsp; | &nbsp; नमस्ते! &nbsp; | &nbsp; अस्सलामु अलैकुम! &nbsp; | &nbsp; Sat Sri Akal! &nbsp; | &nbsp; Shalom! &nbsp; | &nbsp; Namaskāra! &nbsp; | &nbsp; Vanakkam!
    </div>

    <nav id="navMenu">
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="sell.html">Sell Books</a></li>
            <li id="loginTab"><a href="login.html">Login</a></li>
            <li id="registerTab"><a href="register.html">Register</a></li>
        </ul>
    </nav>

    <h1>Buy Books</h1>

    <div class="filters">
        <input type="text" id="search" placeholder="Search by title or author">
        <select id="filterType">
            <option value="">All Types</option>
            <option value="Academic/Text-Book">Academic/Text-Book</option>
            <option value="For Graduation/Post-Graduation">For Graduation/Post-Graduation</option>
            <option value="Competitive Exams">Competitive Exams</option>
            <option value="Children">Children</option>
            <option value="Entrance Test Based">Entrance Test Based</option>
            <option value="All NCERT Types">All NCERT Types</option>
            <option value="Science & Technology">Science & Technology</option>
            <option value="Biography">Biography</option>
            <option value="Others">Others</option>
        </select>
        <select id="filterLanguage">
            <option value="">All Languages</option>
            <option value="Hindi">Hindi</option>
            <option value="English">English</option>
            <option value="Urdu">Urdu</option>
            <option value="Sanskrit">Sanskrit</option>
            <option value="Other">Other</option>
        </select>
        <select id="filterCondition">
            <option value="">All Conditions</option>
            <option value="Like New">Like New</option>
            <option value="Good">Good</option>
            <option value="Fair">Fair</option>
            <option value="Poor">Poor</option>
        </select>
        <select id="sortPrice">
            <option value="">Sort by Price</option>
            <option value="asc">Low to High</option>
            <option value="desc">High to Low</option>
        </select>
    </div>

    <div class="loading" id="loading">Loading books...</div>
    <div class="book-grid" id="bookGrid"></div>
    <button class="load-more" id="loadMore" style="display:none;">Load More</button>

    <footer style="text-align: center; padding: 10px; background-color: black; color: white; margin-top: 20px;">
        &copy; 2025 MOHD MUSTQEEM SIDDIQI. All rights reserved.
    </footer>

    <script>
        let allBooks = [];
        let displayedBooks = [];
        let currentPage = 1;
        const booksPerPage = 10;
        let debounceTimer;  // For debouncing search input

        // Handle login state
        const isLoggedIn = localStorage.getItem('isLoggedIn') === 'true';
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        if (isLoggedIn) {
            loginTab.innerHTML = '<a href="dashboard.html">Dashboard</a>';
            registerTab.innerHTML = '<a href="#" onclick="logout()">Logout</a>';
        }
        function logout() {
            localStorage.removeItem('isLoggedIn');
            location.reload();
        }

        // Fetch books from API (FIXED: Access the 'books' array from the response object)
        async function fetchBooks() {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';
            try {
                const response = await fetch('https://book-seller-backend-b84y.onrender.com/api/books');
                if (!response.ok) throw new Error('Failed to fetch books');
                const data = await response.json();  // Response is { books: [...], ... }
                allBooks = data.books;  // FIX: Access the 'books' array
                displayedBooks = [...allBooks];
                renderBooks(true);  // Full render on initial load
            } catch (error) {
                console.error(error);
                alert('Error loading books. Please try again later.');
            } finally {
                loading.style.display = 'none';
            }
        }

        // Render books - Updated to show limited info with login gate
        function renderBooks(fullRender = false) {
            const grid = document.getElementById('bookGrid');
            const loadMoreBtn = document.getElementById('loadMore');
            const start = fullRender ? 0 : (currentPage - 1) * booksPerPage;
            const end = currentPage * booksPerPage;
            const booksToShow = displayedBooks.slice(start, end);

            if (fullRender) {
                grid.innerHTML = '';  // Clear only on full render
            }

            const fragment = document.createDocumentFragment();  // Use fragment for smooth append
            booksToShow.forEach(book => {
                const card = document.createElement('div');
                card.className = 'book-card';
                card.innerHTML = `
                    <img src="${book.imageUrl || 'images/placeholder.png'}" alt="${book.title}" onerror="this.src='images/placeholder.png'">
                    <h3>${book.title}</h3>
                    <p><strong>Author:</strong> ${book.author}</p>
                    <p><strong>Condition:</strong> ${book.condition}</p>
                    <p><strong>Type:</strong> ${book.type}</p>
                    <p><strong>Language:</strong> ${book.language}</p>
                    <p><strong>Price:</strong> ₹${book.sellingPrice} (Original: ₹${book.originalPrice})</p>
                    <p><strong>Negotiable:</strong> ${book.negotiable}</p>
                    <div class="full-details" id="details-${book._id}">
                        <p><strong>Seller:</strong> ${book.name}</p>
                        <p><strong>Location:</strong> ${book.city}</p>
                        <p><strong>Delivery:</strong> ${book.delivery}</p>
                        <button class="contact-btn" onclick="contactSeller('${book.phone}', '${book.name}')">Contact Seller</button>
                    </div>
                    <button class="contact-btn" onclick="toggleDetails('${book._id}')">Login to View Full Details</button>
                `;
                fragment.appendChild(card);
            });
            grid.appendChild(fragment);

            if (displayedBooks.length > end) {
                loadMoreBtn.style.display = 'block';
            } else {
                loadMoreBtn.style.display = 'none';
            }
        }

        // Toggle full details (login gate) - UPDATED: Add/remove 'expanded' class for proper display
        function toggleDetails(bookId) {
            const details = document.getElementById(`details-${bookId}`);
            const card = details.closest('.book-card');  // Find the parent card
            if (isLoggedIn) {
                const isVisible = details.style.display === 'block';
                details.style.display = isVisible ? 'none' : 'block';
                card.classList.toggle('expanded', !isVisible);  // Expand card when details are shown
            } else {
                window.location.href = 'login.html';
            }
        }

        // Load more books
        document.getElementById('loadMore').addEventListener('click', () => {
            currentPage++;
            renderBooks();
        });

        // Search and filter - Fixed: Debounced search to prevent rapid re-renders
        function applyFilters() {
            const search = document.getElementById('search').value.toLowerCase();
            const type = document.getElementById('filterType').value;
            const language = document.getElementById('filterLanguage').value;
            const condition = document.getElementById('filterCondition').value;
            const sort = document.getElementById('sortPrice').value;

            displayedBooks = allBooks.filter(book =>
                (book.title.toLowerCase().includes(search) || book.author.toLowerCase().includes(search)) &&
                (!type || book.type === type) &&
                (!language || book.language === language) &&
                (!condition || book.condition === condition)
            );

            if (sort === 'asc') {
                displayedBooks.sort((a, b) => a.sellingPrice - b.sellingPrice);
            } else if (sort === 'desc') {
                displayedBooks.sort((a, b) => b.sellingPrice - a.sellingPrice);
            }

            currentPage = 1;
            renderBooks(true);  // Full re-render on filter change
        }

        // Debounced search
        document.getElementById('search').addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(applyFilters, 500);  // 500ms delay
        });
        document.getElementById('filterType').addEventListener('change', applyFilters);
        document.getElementById('filterLanguage').addEventListener('change', applyFilters);
        document.getElementById('filterCondition').addEventListener('change', applyFilters);
        document.getElementById('sortPrice').addEventListener('change', applyFilters);

        // Contact seller
        function contactSeller(phone, name) {
            if (phone) {
                const message = `Hi ${name}, I'm interested in your book. Can we discuss?`;
                window.open(`https://wa.me/${phone.replace(/\D/g, '')}?text=${encodeURIComponent(message)}`, '_blank');
            } else {
                alert('Phone number not available. Please contact via email if possible.');
            }
        }

        // Initialize
        fetchBooks();
    </script>
</body>
</html>
