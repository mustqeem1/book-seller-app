<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="css/login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="wrapper">
        <form id="forgotForm">
            <h1>Forgot Password</h1>
            <p>Enter your email to receive a reset link.</p>
            <div class="input-box">
                <input type="email" id="email" placeholder="Enter Email" required>
                <i class='bx bx-envelope'></i> 
            </div>
            <button type="submit" class="btn">Send Reset Link</button>
            <div id="message" style="color: red; margin-top: 10px;"></div>
            <div class="register-link">
                <p>Remember your password? <a href="login.html">Login</a></p>
            </div>
        </form>
    </div>
    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const message = document.getElementById('message');
            message.textContent = '';

            if (!email) {
                message.textContent = 'Please enter your email.';
                return;
            }

            try {
                const response = await fetch('https://book-seller-backend-b84y.onrender.com/api/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await response.json();
                if (response.ok) {
                    message.style.color = 'green';
                    message.textContent = 'Reset link sent to your email!';
                } else {
                    message.textContent = data.error || 'Failed to send reset link. Check email.';
                }
            } catch (error) {
                console.error(error);
                message.textContent = 'Network error. Check your connection or backend.';
            }
        });
    </script>
</body>
</html>
