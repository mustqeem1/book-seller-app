<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register Form</title>
    <link rel="stylesheet" href="css/login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="wrapper">
        <form id="registerForm">
            <h1>Register</h1>
            <div class="input-box">
                <input type="text" id="name" placeholder="Enter Full Name" required>
                <i class='bx bx-user'></i> 
            </div>
            <div class="input-box">
                <input type="email" id="email" placeholder="Enter Email" required>
                <i class='bx bx-envelope'></i> 
            </div>
            <div class="input-box">
                <input type="tel" id="phone" placeholder="Enter Phone Number" pattern="[0-9]{10}" required>
                <i class='bx bx-phone'></i> 
            </div>
            <div class="input-box">
                <input type="password" id="password" placeholder="Enter Password" required>
                <i class='bx bx-lock'></i> 
            </div>
            <div class="input-box">
                <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                <i class='bx bx-lock-alt'></i> 
            </div>
            <div class="remember-forgot">
                <label><input type="checkbox" id="agree" required>I agree to the <a href="#" target="_blank">terms & conditions</a></label>
            </div>
            <button type="submit" class="btn">Register</button>
            <div id="message" style="color: red; margin-top: 10px;"></div>
            <div class="register-link">
                <p>Already have an account? <a href="login.html">Login</a></p>
            </div>
        </form>
    </div>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const message = document.getElementById('message');
            message.textContent = '';

            if (password !== confirmPassword) {
                message.textContent = 'Passwords do not match';
                return;
            }

            try {
                const response = await fetch('https://book-seller-backend-b84y.onrender.com/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password, phone })
                });
                const data = await response.json();
                if (response.ok) {
                    message.style.color = 'green';
                    message.textContent = 'Registration successful! Redirecting to login...';
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    message.textContent = data.error || 'Registration failed';
                }
            } catch (error) {
                message.textContent = 'Network error. Try again.';
            }
        });
    </script>
</body>
</html>
